<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XLSR AI Upscaler</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>⚡ XLSR Enhancer</h2>
            <span id="statusBadge" class="badge-idle">⏳ Loading Model...</span>
        </div>

        <!-- Upload Area -->
        <div class="upload-box" id="uploadArea">
            <input type="file" id="imageInput" accept="image/*">
            <p class="upload-icon">🖼️</p>
            <p class="upload-text">Click or Drag Image Here</p>
            <p class="upload-sub">100% Private. Runs on WebGPU.</p>
        </div>

        <!-- Download Progress Bar (File Size 140KB, toh Instant hoga) -->
        <div class="progress-container" id="progressContainer" style="display: none;">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
            </div>
            <p class="progress-text" id="progressText">Initializing...</p>
        </div>

        <!-- Preview Section -->
        <div class="preview-row">
            <div class="image-box">
                <p class="label">📥 Input (Low Res)</p>
                <img id="originalImage" src="" alt="Upload here">
            </div>
            <div class="arrow">➡️</div>
            <div class="image-box">
                <p class="label">🚀 Enhanced (3x AI)</p>
                <div class="canvas-wrapper">
                    <canvas id="outputCanvas"></canvas>
                    <div id="loadingSpinner" class="hidden">🔄 Enhancing...</div>
                </div>
            </div>
        </div>

        <button id="downloadBtn" class="btn-download" disabled>⬇️ Download HD Image</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
